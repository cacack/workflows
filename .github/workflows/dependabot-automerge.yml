name: Dependabot Auto-Merge

# Reusable: callers keep a stub that triggers on pull_request_target and calls
# this with `secrets: inherit`. See README.md.
#
# The called workflow sees the caller's event context, so github.event.pull_request
# refers to the caller repo's PR.
on:
  workflow_call:
    inputs:
      merge-method:
        description: "Merge method passed to `gh pr merge` (merge, squash, rebase)."
        type: string
        required: false
        default: merge
      ecosystems:
        description: >-
          Comma-separated allowlist of Dependabot package ecosystems to act on
          (e.g. "github_actions,cargo"), no spaces. Empty means every ecosystem.
        type: string
        required: false
        default: ""
      # This job's egress is small and knowable, and it is the most
      # supply-chain-sensitive one in the set — an App token with Contents,
      # Pull requests, and Workflows write, on pull_request_target. So it
      # blocks by default rather than deferring to a permanent audit. The
      # inputs exist because a caller cannot re-harden a called workflow's
      # steps from its stub; without them, an unlisted endpoint would leave
      # the caller with no remedy.
      egress-policy:
        description: >-
          harden-runner egress policy: "block" (default) or "audit". Use
          "audit" to observe traffic while diagnosing a blocked endpoint.
        type: string
        required: false
        default: block
      allowed-endpoints:
        description: >-
          Space-separated host:port allowlist applied when egress-policy is
          "block". Setting this replaces the built-in list rather than adding
          to it. Ignored under "audit".
        type: string
        required: false
        default: >-
          github.com:443
          api.github.com:443
          codeload.github.com:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          raw.githubusercontent.com:443
          *.actions.githubusercontent.com:443
          *.blob.core.windows.net:443
    secrets:
      BOT_APP_ID:
        description: "App ID of the caller repo's <repo>-steward GitHub App."
        required: true
      BOT_PRIVATE_KEY:
        description: "Private key of that App. Needs Contents, Pull requests, and Workflows write."
        required: true

permissions:
  contents: read

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    # GITHUB_TOKEN only reads PR metadata here; the merge and approve steps act
    # as the caller repo's GitHub App instead (see the token step below).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          skip-commit-verification: true

      # Majors are always left for manual review. When the caller sets an
      # allowlist, ecosystems outside it are skipped too. Computed once so the
      # merge and approve steps share one condition — and so a run with nothing
      # to do says why and still ends green.
      - name: Decide whether to act
        id: scope
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          ECOSYSTEMS: ${{ inputs.ecosystems }}
        run: |
          set -euo pipefail
          if [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            echo "skip: major update"
            act=false
          elif [ -z "$ECOSYSTEMS" ]; then
            act=true
          else
            # Wrapping both sides in commas makes the match exact, so an entry
            # cannot match a different ecosystem that merely contains it.
            case ",$ECOSYSTEMS," in
              *",$ECOSYSTEM,"*)
                act=true
                ;;
              *)
                echo "skip: $ECOSYSTEM not in allowlist ($ECOSYSTEMS)"
                act=false
                ;;
            esac
          fi
          echo "act=$act" >> "$GITHUB_OUTPUT"

      # Most Dependabot PRs edit .github/workflows/*, and GitHub refuses to enable
      # auto-merge on those without the `workflow` permission — which GITHUB_TOKEN
      # cannot be granted through a workflow's permissions: block. A GitHub App
      # installation token can hold it, and expires with the job, so there is no
      # PAT to rotate. An App token also triggers workflow runs on the resulting
      # merge commit, which GITHUB_TOKEN does not.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Auto-merge minor and patch updates
        if: steps.scope.outputs.act == 'true'
        run: gh pr merge --auto --"$MERGE_METHOD" "$PR_URL"
        env:
          MERGE_METHOD: ${{ inputs.merge-method }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Approve PR
        if: steps.scope.outputs.act == 'true'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
