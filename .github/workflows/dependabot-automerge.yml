name: Dependabot Auto-Merge

# Reusable: callers keep a stub that triggers on pull_request_target and maps
# the two secrets below through by name. See README.md.
#
# The called workflow sees the caller's event context, so github.event.pull_request
# refers to the caller repo's PR.
on:
  workflow_call:
    inputs:
      merge-method:
        description: "Merge method passed to `gh pr merge` (merge, squash, rebase)."
        type: string
        required: false
        default: merge
      ecosystems:
        description: >-
          Comma-separated allowlist of Dependabot package ecosystems to act on
          (e.g. "github_actions,cargo"), no spaces. Empty means every ecosystem.
        type: string
        required: false
        default: ""
      merge-commit-body:
        description: >-
          Body of the merge commit, used only when merge-method is "merge".
          Empty by default: on a repo whose merge_commit_message is PR_TITLE,
          a body left to GitHub inherits Dependabot's conventional PR title,
          which release-please then parses a second time.
        type: string
        required: false
        default: ""
      # This job's egress is small and knowable, and it is the most
      # supply-chain-sensitive one in the set — an App token with Contents,
      # Pull requests, and Workflows write, on pull_request_target. So it
      # blocks by default rather than deferring to a permanent audit. The
      # inputs exist because a caller cannot re-harden a called workflow's
      # steps from its stub; without them, an unlisted endpoint would leave
      # the caller with no remedy.
      egress-policy:
        description: >-
          harden-runner egress policy: "block" (default) or "audit". Use
          "audit" to observe traffic while diagnosing a blocked endpoint.
        type: string
        required: false
        default: block
      allowed-endpoints:
        description: >-
          Space-separated host:port allowlist applied when egress-policy is
          "block". Setting this replaces the built-in list rather than adding
          to it. Ignored under "audit".
        type: string
        required: false
        default: >-
          github.com:443
          api.github.com:443
          codeload.github.com:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          raw.githubusercontent.com:443
          *.actions.githubusercontent.com:443
          *.blob.core.windows.net:443
    secrets:
      BOT_APP_ID:
        description: "App ID of the caller repo's <repo>-steward GitHub App."
        required: true
      BOT_PRIVATE_KEY:
        description: "Private key of that App. Needs Contents, Pull requests, and Workflows write."
        required: true

permissions:
  contents: read

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    # GITHUB_TOKEN only reads PR metadata here; the merge and approve steps act
    # as the caller repo's GitHub App instead (see the token step below).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          skip-commit-verification: true

      # Majors are left for manual review, and so is anything Dependabot declines
      # to classify. When the caller sets an allowlist, ecosystems outside it are
      # skipped too. Computed once so the merge and approve steps share one
      # condition — and so a run with nothing to do says why and still ends green.
      - name: Decide whether to act
        id: scope
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PREVIOUS: ${{ steps.metadata.outputs.previous-version }}
          NEW: ${{ steps.metadata.outputs.new-version }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          ECOSYSTEMS: ${{ inputs.ecosystems }}
        run: |
          set -euo pipefail

          # Dependabot omits update-type for indirect (transitive) dependencies,
          # so an empty value must not read as "not a major". Fall back to
          # comparing major components, and deny anything that will not parse:
          # absence of information is not permission.
          major() { printf '%s' "$1" | grep -oE '^[0-9]+' || true; }

          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              within_major=true
              ;;
            version-update:semver-major)
              echo "skip: major update"
              within_major=false
              ;;
            *)
              prev_major=$(major "$PREVIOUS")
              new_major=$(major "$NEW")
              if [ -z "$prev_major" ] || [ -z "$new_major" ]; then
                echo "skip: no update-type, and versions do not parse ('$PREVIOUS' -> '$NEW')"
                within_major=false
              elif [ "$prev_major" = "$new_major" ]; then
                echo "no update-type; within major $new_major ($PREVIOUS -> $NEW)"
                within_major=true
              else
                echo "skip: no update-type; major change ($PREVIOUS -> $NEW)"
                within_major=false
              fi
              ;;
          esac

          if [ "$within_major" = false ]; then
            act=false
          elif [ -z "$ECOSYSTEMS" ]; then
            act=true
          else
            # Wrapping both sides in commas makes the match exact, so an entry
            # cannot match a different ecosystem that merely contains it.
            case ",$ECOSYSTEMS," in
              *",$ECOSYSTEM,"*)
                act=true
                ;;
              *)
                echo "skip: $ECOSYSTEM not in allowlist ($ECOSYSTEMS)"
                act=false
                ;;
            esac
          fi
          echo "act=$act" >> "$GITHUB_OUTPUT"

      # Most Dependabot PRs edit .github/workflows/*, and GitHub refuses to enable
      # auto-merge on those without the `workflow` permission — which GITHUB_TOKEN
      # cannot be granted through a workflow's permissions: block. A GitHub App
      # installation token can hold it, and expires with the job, so there is no
      # PAT to rotate. An App token also triggers workflow runs on the resulting
      # merge commit, which GITHUB_TOKEN does not.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      # --body "" is not the same as omitting --body: gh sends commitBody only
      # when the flag was supplied, and an omitted body lets the repo's
      # merge_commit_message setting put the PR title there instead. --subject
      # is needed for the same reason in reverse — --body alone still leaves
      # the title-derived subject in play. Squash and rebase keep the plain
      # call. See README, "Merge commits and release-please", for why any of
      # this matters.
      - name: Auto-merge minor and patch updates
        if: steps.scope.outputs.act == 'true'
        run: |
          set -euo pipefail
          if [ "$MERGE_METHOD" = "merge" ]; then
            gh pr merge --auto --merge \
              --subject "Merge pull request #${PR_NUMBER} from ${HEAD_OWNER}/${HEAD_REF}" \
              --body "$MERGE_BODY" \
              "$PR_URL"
          else
            gh pr merge --auto --"$MERGE_METHOD" "$PR_URL"
          fi
        env:
          MERGE_METHOD: ${{ inputs.merge-method }}
          MERGE_BODY: ${{ inputs.merge-commit-body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Approve PR
        if: steps.scope.outputs.act == 'true'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
